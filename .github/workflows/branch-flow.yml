name: Branch flow

# Enforces the promotion path: feature branch -> dev -> main.
# "PR to main must come from dev" is a required status check on main.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  source-branch:
    name: PR to main must come from dev
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests into main must come from the dev branch of this repository (got '$HEAD_REPO:$HEAD_REF')."
            exit 1
          fi
          echo "Source branch is dev."
